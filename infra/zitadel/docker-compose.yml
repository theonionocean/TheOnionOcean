services:
  zitadel-proxy:
    image: caddy:${CADDY_IMAGE_VERSION}
    container_name: zitadel-proxy
    env_file:
      - ./zitadel.env
    volumes:
      - "./caddy/zitadel.Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./caddy/certs/cert.pem:/etc/certs/cert.pem:ro"
      - "./caddy/certs/key.pem:/etc/certs/key.pem:ro"
    environment:
      - ZITADEL_EXTERNAL_DOMAIN=${ZITADEL_EXTERNAL_DOMAIN}
    ports:
      - 443:443
      - 443:443/udp
    networks:
      - zitadel
    depends_on:
      zitadel-api:
        condition: service_healthy

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_IMAGE_VERSION}
    container_name: zitadel-api
    command: start-from-init --masterkey "${ZITADEL_MASTER_KEY}"
    env_file:
      - ./zitadel.env
    environment:
      # Using an external domain other than localhost proofs, that the proxy configuration works.
      # If Zitadel can't resolve a requests original host to this domain,
      # it will return a 404 Instance not found error.
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNAL_DOMAIN}
      # In case something doesn't work as expected,
      # it can be handy to be able to read the access logs.
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: ${ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED}
      # For convenience, ZITADEL should not ask to change the initial admin users password.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED}
      # database configuration
      ZITADEL_DATABASE_POSTGRES_DSN: ${ZITADEL_DATABASE_POSTGRES_DSN}
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-postgres
      # ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DATABASE_POSTGRES_USER_PASSWORD}
      # Set up a service account with IAM_LOGIN_CLIENT role and write the PAT to the file ./login-client.pat
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE}
      # ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /current-dir/login-client.pat
      # ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      # ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized instance Login Client
      # ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: true
      ZITADEL_TLS_ENABLED: false
      # The master key is used to
    networks:
      - zitadel
      - zitadel-database
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "10s"
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    depends_on:
      zitadel-postgres:
        condition: service_healthy

  zitadel-login:
    restart: unless-stopped
    image: "ghcr.io/zitadel/zitadel-login:${ZITADEL_IMAGE_VERSION}"
    container_name: zitadel-login
    env_file:
      - ./zitadel.env
    environment:
      - ZITADEL_API_URL=http://zitadel-api:8080
      - NEXT_PUBLIC_BASE_PATH=/ui/v2/login
      - ZITADEL_SERVICE_USER_TOKEN_FILE=/zitadel/bootstrap/login-client.pat
      - CUSTOM_REQUEST_HEADERS=Host:${ZITADEL_EXTERNAL_DOMAIN}
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    networks:
      - zitadel
    depends_on:
      zitadel-api:
        condition: service_healthy

  zitadel-postgres:
    image: postgres:${POSTGRES_IMAGE_VERSION}
    container_name: zitadel-postgres
    restart: unless-stopped
    env_file:
      - ./zitadel.env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_ADMIN_USER}
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 20s
    volumes:
      - postgres-data:/var/lib/postgresql:rw
    networks:
      - zitadel

  # zitadel-postgres:
  #   restart: unless-stopped
  #   image: postgres:${POSTGRES_IMAGE_VERSION}
  #   container_name: zitadel-postgres
  #   env_file:
  #     - ./zitadel.env
  #   environment:
  #     POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
  #     POSTGRES_USER: ${POSTGRES_ADMIN_USER}
  #     POSTGRES_DB: ${POSTGRES_DB}
