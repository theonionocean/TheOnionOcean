services:
  prutaj-surrealdb:
    image: surrealdb/surrealdb:${SURREALDB_VERSION}
    container_name: prutaj-surrealdb
    env_file:
      - ./prutaj-board.env
    restart: unless-stopped
    ports:
      - 8000:8000
    volumes:
      - surrealdb_data:/home/nonroot/surrealdb
    command: start -u ${SURREALDB_USER} -p ${SURREALDB_PASSWORD} ${SURREALDB_URL}
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  surrealdb_data:
