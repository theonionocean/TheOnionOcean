
[workspace]
resolver = '2'
members = [
	'lib/rust/mediatr',
	'apps/rust/prutaj_board',
	'lib/rust/surrealdb_extensions',
]

[workspace.dependencies.actix-web]
version = '4.14.0'

[workspace.dependencies.chrono]
version = '0.4.45'

[workspace.dependencies.surrealdb]
version = '3.2.1'
features = ['kv-rocksdb']

[workspace.dependencies.serde]
version = '1.0.229'

[workspace.dependencies.ulid]
version = '3.0.0'

[patch.crates-io]
# diskann-wide 0.54.0 uses AVX-512 VNNI intrinsics (_mm512_dpwssd_epi32 etc.) via
# #[target_feature] which triggers an LLVM 21 bug ("Cannot select: intrinsic
# %llvm.x86.avx512.vpdpwssd.512") on non-AVX-512 CPUs (e.g. Zen2). This local
# patch replaces the VNNI intrinsics with equivalent AVX-512BW/AVX2 fallbacks so
# the crate compiles on all x86_64 hosts regardless of AVX-512 support.
diskann-wide = { path = "vendor/diskann-wide" }

[profile.release]
lto = true
