info:
  name: update_user
  type: http
  seq: 4
  tags:
    - user

http:
  method: PUT
  url: "{{baseUrl}}/api/user/update"
  body:
    type: json
    data: |-
      {
        "email": "{{$randomEmail}}",
        "id": "{{userId}}",
        "name": "{{$randomFullName}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: User updated successfully
    request:
      url: "{{baseUrl}}/api/user/update"
      method: PUT
      body:
        type: json
        data: |-
          {
            "email": "",
            "id": "",
            "name": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "created_at": "",
            "email": "",
            "id": "",
            "name": ""
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/user/update"
      method: PUT
      body:
        type: json
        data: |-
          {
            "email": "",
            "id": "",
            "name": ""
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: text/plain
      body:
        type: text
        data: ""
