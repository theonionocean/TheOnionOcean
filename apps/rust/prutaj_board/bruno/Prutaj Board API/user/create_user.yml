info:
  name: create_user
  type: http
  seq: 1
  tags:
    - user

http:
  method: POST
  url: "{{baseUrl}}/api/user/create"
  body:
    type: json
    data: |-
      {
        "email": "",
        "name": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: User created successfully
    request:
      url: "{{baseUrl}}/api/user/create"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "name": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "created_at": "",
            "email": "",
            "id": "",
            "name": ""
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/user/create"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "name": ""
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: text/plain
      body:
        type: text
        data: ""
