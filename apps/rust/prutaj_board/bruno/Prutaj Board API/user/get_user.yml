info:
  name: get_user
  type: http
  seq: 3
  tags:
    - user

http:
  method: GET
  url: "{{baseUrl}}/api/user/get/:id"
  params:
    - name: id
      value: ""
      type: path
      description: User id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: User retrieved successfully
    request:
      url: "{{baseUrl}}/api/user/get/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: User id
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "created_at": "",
            "email": "",
            "id": "",
            "name": ""
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/user/get/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: User id
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: text/plain
      body:
        type: text
        data: ""
