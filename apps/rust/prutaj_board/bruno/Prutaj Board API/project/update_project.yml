info:
  name: update_project
  type: http
  seq: 4
  tags:
    - project

http:
  method: PUT
  url: "{{baseUrl}}/api/project/update"
  body:
    type: json
    data: |-
      {
        "description": "{{$randomLoremSentence}}",
        "id": "{{projectId}}",
        "name": "{{$randomProductName}}",
        "slug": "{{$randomLoremSlug}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Project updated successfully
    request:
      url: "{{baseUrl}}/api/project/update"
      method: PUT
      body:
        type: json
        data: |-
          {
            "description": "",
            "id": "",
            "name": "",
            "slug": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "created_at": "",
            "created_by": {
              "created_at": "",
              "email": "",
              "id": "",
              "name": ""
            },
            "description": "",
            "id": "",
            "modified_by": {
              "created_at": "",
              "email": "",
              "id": "",
              "name": ""
            },
            "name": "",
            "slug": "",
            "updated_at": ""
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/project/update"
      method: PUT
      body:
        type: json
        data: |-
          {
            "description": "",
            "id": "",
            "name": "",
            "slug": ""
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: text/plain
      body:
        type: text
        data: ""
