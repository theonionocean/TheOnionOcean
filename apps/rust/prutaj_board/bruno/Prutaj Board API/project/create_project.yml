info:
  name: create_project
  type: http
  seq: 1
  tags:
    - project

http:
  method: POST
  url: "{{baseUrl}}/api/project/create"
  body:
    type: json
    data: |-
      {
        "description": "{{$randomLoremSentence}}",
        "name": "{{$randomProductName}}",
        "slug": "{{$randomLoremSlug}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.id) {
          bru.setEnvVar('projectId', res.body.id.key.String);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Project created successfully
    request:
      url: "{{baseUrl}}/api/project/create"
      method: POST
      body:
        type: json
        data: |-
          {
            "description": "",
            "name": "",
            "slug": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "created_at": "",
            "created_by": {
              "created_at": "",
              "email": "",
              "id": "",
              "name": ""
            },
            "description": "",
            "id": "",
            "modified_by": {
              "created_at": "",
              "email": "",
              "id": "",
              "name": ""
            },
            "name": "",
            "slug": "",
            "updated_at": ""
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/project/create"
      method: POST
      body:
        type: json
        data: |-
          {
            "description": "",
            "name": "",
            "slug": ""
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: text/plain
      body:
        type: text
        data: ""
