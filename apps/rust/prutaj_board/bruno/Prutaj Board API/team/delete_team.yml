info:
  name: delete_team
  type: http
  seq: 2
  tags:
    - team

http:
  method: DELETE
  url: "{{baseUrl}}/api/team/delete"
  body:
    type: json
    data: |-
      {
        "id": "{{teamId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Team deleted successfully
    request:
      url: "{{baseUrl}}/api/team/delete"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "id": ""
          }
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/team/delete"
      method: DELETE
      body:
        type: json
        data: |-
          {
            "id": ""
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: text/plain
      body:
        type: text
        data: ""
