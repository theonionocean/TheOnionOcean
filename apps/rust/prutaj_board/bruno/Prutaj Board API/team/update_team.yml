info:
  name: update_team
  type: http
  seq: 4
  tags:
    - team

http:
  method: PUT
  url: "{{baseUrl}}/api/team/update"
  body:
    type: json
    data: |-
      {
        "id": "{{teamId}}",
        "name": "{{$randomWords}} Team",
        "organization": {
          "created_at": "{{$randomDatePast}}",
          "id": "{{organizationId}}",
          "legal_name": "{{$randomCompanyName}} {{$randomCompanySuffix}}",
          "logo": "{{$randomImageUrl}}",
          "name": "{{$randomCompanyName}}",
          "owner": {
            "created_at": "{{$randomDatePast}}",
            "email": "{{$randomEmail}}",
            "id": "{{userId}}",
            "name": "{{$randomFullName}}"
          },
          "slug": "{{$randomLoremSlug}}",
          "teams": []
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

