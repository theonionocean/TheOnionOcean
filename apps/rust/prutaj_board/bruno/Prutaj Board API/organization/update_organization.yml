            "id": "",
            "legal_name": "",
            "logo": "",
            "name": "",
            "owner": {
              "created_at": "",
              "email": "",
              "id": "",
              "name": ""
            },
            "slug": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
