info:
  name: update_organization
  type: http
  seq: 4
  tags:
    - organization

http:
  method: PUT
  url: "{{baseUrl}}/api/organization/update"
  body:
    type: json
    data: |-
      {
        "id": "{{organizationId}}",
        "legal_name": "{{$randomCompanyName}} {{$randomCompanySuffix}}",
        "logo": "{{$randomImageUrl}}",
        "name": "{{$randomCompanyName}}",
        "owner": {
          "created_at": "{{$randomDatePast}}",
          "email": "{{$randomEmail}}",
          "id": "{{userId}}",
          "name": "{{$randomFullName}}"
        },
        "slug": "{{$randomLoremSlug}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Organization updated successfully
    request:
      url: "{{baseUrl}}/api/organization/update"
      method: PUT
      body:
        type: json
