info:
  name: get_organization
  type: http
  seq: 3
  tags:
    - organization

http:
  method: GET
  url: "{{baseUrl}}/api/organization/get/:id"
  params:
    - name: id
      value: "{{organizationId}}"
      type: path
      description: Organization id
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

