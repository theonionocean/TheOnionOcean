info:
  name: 03 GetUserInfoWithOAuth2AuthorizationCode
  type: http
  seq: 3

http:
  method: GET
  url: "{{authBaseUrl}}/oidc/v1/userinfo"
  auth:
    type: oauth2
    flow: authorization_code
    authorizationUrl: "{{authBaseUrl}}/oauth/v2/authorize"
    accessTokenUrl: "{{authBaseUrl}}/oauth/v2/token"
    refreshTokenUrl: "{{authBaseUrl}}/oauth/v2/token"
    callbackUrl: "{{authOAuthCallbackUrl}}"
    credentials:
      clientId: "{{authApiClientId}}"
      placement: body
    scope: "{{authApiScope}}"
    state: shiptech-bruno
    pkce: {}
    tokenConfig:
      id: credentials
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300) {
          const token = bru.getOauth2CredentialVar("$oauth2.credentials.access_token");
          if (token) {
            bru.setEnvVar("authAccessToken", String(token), { persist: true });
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
